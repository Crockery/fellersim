name: Fellersim
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    # inputs:
    #   aur_tag:
    #     description: 'Retry AUR publication for an existing stable release (empty runs normal checks)'
    #     type: string
    #     default: ''
    #   pkgrel:
    #     description: 'AUR package revision'
    #     type: string
    #     default: '1'

permissions:
  contents: read

jobs:
  build:
    # Restore this filter with the AUR dispatch inputs and publication job.
    # if: github.event_name != 'workflow_dispatch' || inputs.aur_tag == ''
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: rustup update stable
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p fellersim
      - name: Offline binary smoke test
        shell: bash
        run: |
          target/release/fellersim --version
          target/release/fellersim run --character apps/fellersim/examples/ardeos.json --apl default-apls/ardeos.apl --iterations 100 --json > result.json
          python -c "import json; r=json.load(open('result.json'))['data']; assert r['meanDps'] > 0 and r['iterations'] == 100"
      - run: python scripts/package-release.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
  smoke-download:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: release
      - run: python scripts/smoke-release.py
  arch-package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: linux-x86_64
          path: release
      - name: Build and test Arch package
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/check-aur.py --archive "release/fellersim-$version-linux-x86_64.tar.gz" --version "$version" --template packaging/aur/PKGBUILD.in --output aur-package
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: aur-package/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-download, arch-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: release
          pattern: "*-x86_64"
          merge-multiple: true
      - name: Check release tag matches workspace version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish public executable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Fellersim $GITHUB_REF_NAME" --generate-notes
